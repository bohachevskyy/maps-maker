[project]
name = "mapsvc"
version = "0.1.0"
description = "Choropleth map server: JSON manifest in, SVG out."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mapsvc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
