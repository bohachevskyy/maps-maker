<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Map maker</title>
  <link rel="stylesheet" href="static/app.css">
</head>
<body>
  <aside class="sidebar" id="sidebar" aria-label="Prompt history">
    <div class="sidebar-top">
      <div class="brand" aria-label="Map maker">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span>Map maker</span>
      </div>
      <button class="icon-button sidebar-close" id="sidebar-close" type="button" aria-label="Close sidebar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <button class="new-map" id="new-map" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      New map
    </button>
    <div class="history-label">Recent prompts</div>
    <nav class="history" id="history" aria-label="Previous prompts"></nav>
  </aside>

  <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>

  <main class="app-shell">
    <header class="mobile-header">
      <button class="icon-button" id="sidebar-open" type="button" aria-label="Open prompt history" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span>Map maker</span>
    </header>

    <section class="conversation" id="conversation" aria-live="polite" aria-relevant="additions text">
      <div class="empty-state" id="empty-state">
        <div class="empty-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M5 7.5 12.5 4l7 3.5L27 4v20.5L19.5 28l-7-3.5L5 28V7.5Z"/><path d="M12.5 4v20.5M19.5 7.5V28"/></svg>
        </div>
        <h1>What would you like to map?</h1>
        <p>Describe a place and the data or features you want to see.</p>
        <div class="examples" id="examples">
          <button type="button">Population of every oblast in Ukraine</button>
          <button type="button">France's high-speed railway network</button>
          <button type="button">Every magnitude 6+ earthquake in 2025</button>
          <button type="button">GDP per capita across Africa</button>
        </div>
      </div>
      <div class="turns" id="turns"></div>
    </section>

    <div class="composer-dock">
      <form class="composer" id="prompt-form">
        <label class="sr-only" for="prompt-box">Describe the map you want</label>
        <textarea id="prompt-box" name="prompt" rows="1" maxlength="4000" placeholder="Describe a map…" autocomplete="off"></textarea>
        <button class="send-button" id="send-button" type="submit" aria-label="Create map">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/></svg>
        </button>
        <button class="cancel-button" id="cancel-button" type="button" hidden>Cancel</button>
      </form>
      <p class="composer-note">Maps can take a minute while data is gathered.</p>
    </div>
  </main>

  <template id="waiting-template">
    <div class="waiting-card response-card" role="status">
      <div class="typing" aria-hidden="true"><span></span><span></span><span></span></div>
      <div>
        <div class="waiting-title">Making your map <span class="elapsed">0s</span></div>
        <div class="waiting-hint">finding data…</div>
      </div>
    </div>
  </template>

  <script src="static/config.js"></script>
  <script src="static/app.js" defer></script>
</body>
</html>
