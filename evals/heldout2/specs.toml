# HELD-OUT SET 2 (2026-10-27) -- measures generalisation; never used for tuning.
# Same rules as evals/heldout/ (CLAUDE.md, "Held-out evals"). Created after
# held-out set 1 was partly burned (its critiques informed the fix plan).
# Spot values marked (verify) are from memory; the reference builder checks them.

[rubric]
data        = "Values are right: spot checks pass, vintage stated, nothing silently dropped."
geography   = "The right units and only them; window framed tightly; no stray features, no antimeridian artefacts."
cartography = "Projection suits the extent; encoding suits the variable (counts are never a raw choropleth); legend readable with units; title says what the map shows."
provenance  = "Footnote names every source, licence, vintage, projection, classification and exclusions."
fidelity    = "The agent understood the prompt: right measure, right place, right granularity."

[[map]]
id = "south_asia_literacy"
prompt = "Adult literacy rate across South Asia"
truth = "OWID literacy-rate (UNESCO/World Bank), latest year; UN M49 Southern Asia"
units = [8, 9]
contains = [[77.2, 28.6], [90.4, 23.8], [73.5, 4.2]]
excludes = [[116.4, 39.9]]
spot = ["LKA>AFG", "AFG<50"]   # (verify)
must_include = ["MDV", "BTN"]
must = ["UN M49 Southern Asia members, Maldives visible", "percent scale, vintage per country stated"]
reference = ["https://ourworldindata.org/grapher/literacy-rate-adults"]

[[map]]
id = "german_states_population"
prompt = "Population of the German federal states"
truth = "Destatis or Eurostat (NUTS 1) population, latest year; 16 Länder"
units = [16, 16]
contains = [[13.40, 52.52], [11.58, 48.14], [8.8, 53.08]]
excludes = [[16.37, 48.21]]
spot = ["DE-NW>DE-HB", "DE-NW>17000000", "DE-HB<800000"]   # (verify)
must_include = ["DE-HB", "DE-BE", "DE-HH"]
must = ["16 Länder incl. city-states Berlin, Hamburg, Bremen visible", "counts as proportional symbols or density", "single recent official vintage"]
reference = ["https://www.destatis.de/EN/"]

[[map]]
id = "turkey_quakes_2023"
prompt = "Earthquakes of magnitude 4.5 or more in Turkey and Syria in 2023"
truth = "USGS FDSN event service, 2023, minmagnitude 4.5, Turkey-Syria region"
units = [100, 600]
contains = [[37.04, 37.17], [36.16, 36.2], [32.85, 39.93]]
excludes = [[2.35, 48.85]]
spot = ["event_near=37.04,37.17"]   # 6 Feb Mw 7.8 (verify)
must = ["the 6 February sequence legible (inset if dense)", "sized by magnitude", "USGS credited"]
reference = ["https://earthquake.usgs.gov/earthquakes/map/"]

