# Agent evaluation cases.
#
# Each case is a prompt plus the assertions that matter FOR THAT PROMPT. The
# model is non-deterministic, so asserting every field would be flaky and would
# mostly test the model's taste rather than its correctness. Assert what the
# prompt actually determines; leave the rest free.
#
# Assertions (all optional):
#   level, variable, source, basemap, detail
#        exact value, or a list meaning "any of these". Strings compare
#        case-insensitively. Use variable = "__null__" to require a base map.
#   contains   [[lon, lat], ...]  the window must cover these points
#   excludes   [[lon, lat], ...]  the window must NOT cover these points
#   max_span   the window's longer side must be at most this many degrees
#   refuse     true -> the agent must decline
#   mentions   substrings the refusal or reasoning must contain
#
# The window is asserted by coverage, never by exact numbers: two sensible
# bboxes for "the Balkans" differ by degrees and both are right.

# ------------------------------------------------------- the window --------

[[case]]
name = "europe window covers the continent"
prompt = "unemployment across Europe"
level = "admin_0"
source = "owid"
variable = "unemployment-rate"
contains = [[2.3, 48.9], [-3.7, 40.4], [30.5, 50.5]]   # Paris, Madrid, Kyiv
excludes = [[-74.0, 40.7], [139.7, 35.7]]              # New York, Tokyo

[[case]]
name = "scandinavia has no code and is now mappable"
prompt = "a map of Scandinavia"
contains = [[10.7, 59.9], [18.1, 59.3], [12.6, 55.7]]  # Oslo, Stockholm, Copenhagen
excludes = [[2.3, 48.9]]                               # not Paris
max_span = 45

[[case]]
name = "the balkans have no code either"
prompt = "show me the Balkans"
contains = [[20.5, 44.8], [23.7, 38.0]]                # Belgrade, Athens
max_span = 30

[[case]]
name = "a city window is small and fine-grained"
prompt = "draw the raions around Kyiv"
level = "admin_2"
variable = "__null__"
contains = [[30.5, 50.45]]
max_span = 8

[[case]]
name = "us states"
prompt = "the states of the USA"
level = "admin_1"
variable = "__null__"
contains = [[-77.0, 38.9], [-118.2, 34.1]]             # DC, Los Angeles
excludes = [[2.3, 48.9]]

[[case]]
name = "the whole world"
prompt = "life expectancy worldwide"
level = "admin_0"
source = "owid"
variable = "life-expectancy"
contains = [[-74.0, 40.7], [139.7, 35.7], [151.2, -33.9]]

# --------------------------------------------------- granularity -----------

[[case]]
name = "a continent window stays at country level"
prompt = "GDP per capita across Africa"
level = "admin_0"
contains = [[3.4, 6.5], [18.4, -33.9]]                 # Lagos, Cape Town

[[case]]
name = "a province window goes to admin_2"
prompt = "the districts around Lviv"
level = ["admin_2", "admin_3"]
variable = "__null__"
contains = [[24.03, 49.84]]
max_span = 8

# ------------------------------------------------- source selection --------

[[case]]
name = "search finds air pollution deaths"
prompt = "deaths from air pollution by country"
source = "owid"

[[case]]
name = "search finds forest cover"
prompt = "share of land covered by forest"
source = "owid"

[[case]]
name = "population still comes from natural earth"
prompt = "total population by country"
source = "natural_earth"
variable = "POP_EST"

[[case]]
name = "income groups are a fixed variable"
prompt = "income groups across Africa"
source = "natural_earth"
variable = "INCOME_GRP"

# ------------------------------------------------------- refusals ----------

[[case]]
name = "no source measures rainfall"
prompt = "average rainfall by country"
refuse = true
mentions = ["rainfall"]

[[case]]
name = "a place with no data is still a place"
prompt = "population of each Ukrainian oblast"
refuse = true
