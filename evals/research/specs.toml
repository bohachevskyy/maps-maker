[[case]]
id = "meteorites_fell"
split = "tune"
prompt = "Map the meteorites that were seen to fall, not just found"
need = "No meteorite dataset in the registry."
should_refuse = false
truth = "meteorites_fell/truth.csv"
expected = { geometry_kind = "points", key_namespace = "coords", level = "point", min_coverage = 0.9, min_vintage = 2013, must_have_licence = false, acceptable_publishers = ["NASA", "Meteoritical Society"] }
