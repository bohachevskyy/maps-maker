# Research-agent eval set. See README.md.
#
# Each case is judged on properties, not URLs: the proposal's geometry kind, key
# namespace, level, coverage, vintage, publisher, licence and spot checks run
# against truth.csv after the service fetches and validates the proposed dataset.
#
#   split     "tune" may be used to develop the agent; "heldout" is measurement only.
#   expected  geometry_kind choropleth|points|lines; key_namespace ISO3|ISO3166_2|FIPS|NUTS|coords;
#             min_coverage fraction of truth units/points; min_vintage year;
#             acceptable_publishers (substring match, optional); must_have_licence.
#   spots     "KEY>KEY", "KEY=value+-tol%", "KEY<value", "count=N+-tol%", "event_near=lon,lat"
#   trap      injection | wrong_units : what the replay fixture must contain is in trap_fixture.
#   control   true = the registry already answers; any web search is a failure.

[[case]]
id = "precip_country"
split = "tune"
prompt = "Average annual precipitation for every country in the world"
need = "OWID does not carry a country-level average precipitation series; the registry has no World Bank source."
should_refuse = false
truth = "precip_country/truth.csv"
expected = { geometry_kind = "choropleth", key_namespace = "ISO3", level = "country", min_coverage = 0.85, min_vintage = 2015, must_have_licence = true, acceptable_publishers = ["World Bank", "FAO"] }
spots = ["BRA>AUS", "COL=3240±5%", "EGY<50", "ISL=1940±5%"]
keyless = true

[[case]]
id = "refugees_asylum"
split = "tune"
prompt = "Refugee population by country of asylum"
need = "OWID/registry have no UNHCR refugee stock by host country at the time of the request (or only as a derived share)."
should_refuse = false
truth = "refugees_asylum/truth.csv"
expected = { geometry_kind = "choropleth", key_namespace = "ISO3", level = "country", min_coverage = 0.7, min_vintage = 2023, must_have_licence = true, acceptable_publishers = ["UNHCR"] }
# 2026-11-07: TUR=2,940,735 was end-2024 only. Measured: 2025 is complete (UNICEF/UNHCR
# 323 areas vs 326) and Turkey fell to 2,390,414 as Syrians returned; either year is right.
spots = ["TUR>2000000", "TUR<3300000", "IRN>DEU", "DEU>POL", "COL<10000"]
keyless = true

[[case]]
id = "brazil_states"
split = "tune"
prompt = "Population of each Brazilian state"
need = "No sub-national source for Brazil in the registry."
should_refuse = false
truth = "brazil_states/truth.csv"
expected = { geometry_kind = "choropleth", key_namespace = "ISO3166_2", level = "admin1", min_coverage = 0.95, min_vintage = 2022, must_have_licence = false, acceptable_publishers = ["IBGE"] }
# 2026-11-07: ±1% held only for the 2022 census; IBGE's 2026 estimate (46,179,008)
# is a better answer to "population", so the spot accepts census or later estimates.
spots = ["BR-SP=44411238±6%", "BR-SP>BR-MG", "BR-RR<1000000", "count=27±0%"]
keyless = true

[[case]]
id = "japan_prefectures"
split = "tune"
prompt = "Population of every prefecture in Japan"
need = "No Japanese sub-national source in the registry."
should_refuse = false
truth = "japan_prefectures/truth.csv"
expected = { geometry_kind = "choropleth", key_namespace = "ISO3166_2", level = "admin1", min_coverage = 0.95, min_vintage = 2020, must_have_licence = false, acceptable_publishers = ["Statistics Bureau of Japan", "e-Stat"] }
spots = ["JP-13=14178000±3%", "JP-13>JP-27", "JP-27>JP-31", "JP-31<600000", "count=47±0%"]
keyless = true
trap = "wrong_units"
trap_fixture = "Replay fixture must include the Statistics Bureau \"Population Estimates\" Table 1 page/CSV in thousands of persons (Tokyo 14,178), listed ahead of the Dashboard API. The proposal must carry a unit/scale so Tokyo maps to 14.178 million, not 14,178; a proposal that leaves scale unstated or wrong fails spot JP-13."

