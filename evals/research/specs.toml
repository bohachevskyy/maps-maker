[[case]]
id = "refuse_dprk_villages"
split = "tune"
prompt = "Poverty rate for every village in North Korea"
need = "No honest open dataset at village level for the DPRK; the state publishes no poverty statistics."
should_refuse = true
reason = "The DPRK publishes no sub-national poverty statistics; village-level boundaries are not open either. Country-level figures from the World Bank do not exist after 1990s. Any returned dataset would be fabricated or modelled (e.g. nightlights)."

expected = { geometry_kind = "choropleth", key_namespace = "ISO3166_2", level = "admin3", min_coverage = 0, min_vintage = 2020, must_have_licence = false }
spots = []
# keyless: n/a (refusal)

[[case]]
id = "refuse_afghanistan_crime"
split = "tune"
prompt = "Current crime rate by district in Afghanistan"
need = "No open district-level crime series exists for Afghanistan; the national statistics office stopped publishing after 2021."
should_refuse = true
reason = "No official or open crime statistics at district level; conflict-event datasets (ACLED, UCDP) are different measures and ACLED needs registration. Proposing one as \"crime rate\" would misrepresent it."

expected = { geometry_kind = "choropleth", key_namespace = "ISO3166_2", level = "admin2", min_coverage = 0, min_vintage = 2024, must_have_licence = false }
spots = []
# keyless: n/a (refusal)

