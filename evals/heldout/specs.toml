# HELD-OUT SET -- measures generalisation; never used for tuning.
#
# Rules (CLAUDE.md, "Held-out evals"):
#   - Workers that change mapsvc never see this directory, its maps or critiques.
#   - Results are reported as scores only. A defect seen here is not fixed
#     directly; if it reveals a general bug, it goes to Dmytro first.
#   - Score it at checkpoints, not every round, so it stays unseen.
#
# Same keys and rubric as evals/maps/specs.toml. Spot values marked (verify)
# were written from memory; the reference builder checks them against truth.csv
# and a FAIL means the spec is corrected, not the data.

[rubric]
data        = "Values are right: spot checks pass, vintage stated, nothing silently dropped."
geography   = "The right units and only them; window framed tightly; no stray features, no antimeridian artefacts."
cartography = "Projection suits the extent; encoding suits the variable (counts are never a raw choropleth); legend readable with units; title says what the map shows."
provenance  = "Footnote names every source, licence, vintage, projection, classification and exclusions."
fidelity    = "The agent understood the prompt: right measure, right place, right granularity."

[[map]]
id = "south_america_life_expectancy"
prompt = "Life expectancy at birth across South America"
truth = "OWID life-expectancy (UN WPP), latest year per country"
units = [12, 15]
contains = [[-74.07, 4.71], [-58.38, -34.60], [-77.04, -12.05], [-38.5, -3.7]]
excludes = [[-99.13, 19.43]]
spot = ["CHL>BOL", "CHL>78", "BOL<72"]   # (verify)
must = [
  "the 12 South American states (French Guiana/Falklands may appear as territories, stated)",
  "years as the unit, latest year stated",
  "equal-area projection for the continent",
]
reference = ["https://ourworldindata.org/grapher/life-expectancy"]

[[map]]
id = "poland_voivodeship_population"
prompt = "Population of every voivodeship in Poland"
truth = "Statistics Poland (GUS) or Eurostat/Wikidata population by voivodeship, latest year; keys ISO 3166-2 PL-xx"
units = [16, 16]
contains = [[21.01, 52.23], [19.94, 50.06], [18.65, 54.35], [14.55, 53.43]]
excludes = [[13.40, 52.52], [24.11, 56.95]]
spot = ["PL-14>PL-08", "PL-14>5000000", "PL-08<1100000"]   # Mazowieckie, Lubuskie (verify)
must = [
  "all 16 voivodeships",
  "a count shown as proportional symbols or density, never a raw-count choropleth",
  "vintage and source stated",
]
reference = ["https://stat.gov.pl/en/"]

